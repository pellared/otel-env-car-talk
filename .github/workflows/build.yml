name: Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Make build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: make install

      - name: Build
        run: make build

  http-to-cli:
    name: Verify HTTP-to-CLI demo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/1-http-to-cli

    steps:
      - uses: actions/checkout@v7

      - name: Start Jaeger and the report API
        run: make up

      - name: Verify the intentionally broken path
        run: |
          set -euo pipefail
          make run
          logs="$(docker compose logs api)"
          grep -F "skipped TRACEPARENT injection into the Python child environment" <<<"$logs"
          grep -F "report-cli: no TRACEPARENT found; build report starts a new trace" <<<"$logs"

      - name: Verify the propagated path
        run: |
          set -euo pipefail
          make fixed
          logs="$(docker compose logs api)"

          api_trace_id="$(
            sed -n 's/.*injected TRACEPARENT .* trace \([[:xdigit:]]\{32\}\).*/\1/p' <<<"$logs" | tail -n 1
          )"
          cli_trace_id="$(
            sed -n 's/.*extracted TRACEPARENT for trace \([[:xdigit:]]\{32\}\).*/\1/p' <<<"$logs" | tail -n 1
          )"

          test -n "$api_trace_id"
          test "$api_trace_id" = "$cli_trace_id"

      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop demo services
        if: ${{ !cancelled() }}
        run: make down
